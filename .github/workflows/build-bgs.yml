# Publishes geol-skills/BGS to this drat repository, which GitHub Pages serves
# at https://geol-skills.github.io/packages:
#   - the source tarball in src/contrib, older versions archived;
#   - a webR binary in bin/emscripten/contrib/<R version>, built with the webR
#     release that the course site's quarto-live loads (WEBR_IMAGE below:
#     update it when quarto-live's webR changes);
#   - empty PACKAGES stubs under bin/windows and bin/macosx, so that Windows
#     and macOS R install the pure-R source quietly rather than warn about a
#     missing binary index. When R adopts a new macOS binary folder, the
#     macOS smoke test fails with its name: add it to tools/publish.R.
# Publishes when BGS's DESCRIPTION has a version not yet here: daily, or on
# demand. Then installs from the live URL, as students will.

name: build-bgs

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if this version is already here"
        type: boolean
        default: false
  repository_dispatch:
    types: [bgs-updated]
  schedule:
    - cron: "41 5 * * *"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPO_URL: https://geol-skills.github.io/packages
  WEBR_IMAGE: ghcr.io/r-wasm/webr:v0.5.8
  WEBR_NPM: webr@0.5.8

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: geol-skills/BGS
          path: BGS

      - id: v
        run: |
          version=$(sed -n 's/^Version: *//p' BGS/DESCRIPTION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C BGS rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -e "src/contrib/BGS_${version}.tar.gz" ] && \
             [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  source:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: geol-skills/BGS
          ref: ${{ needs.version.outputs.sha }}
          path: BGS

      - uses: r-lib/actions/setup-r@v2

      - run: R CMD build --no-manual BGS

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: BGS_*.tar.gz
          retention-days: 1

  wasm:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: github::geol-skills/BGS@${{ needs.version.outputs.sha }}
          repo-path: _wasm
          webr-image: ${{ env.WEBR_IMAGE }}

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: _wasm/bin/emscripten
          retention-days: 1

  publish:
    needs: [version, source, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - run: Rscript -e 'install.packages("drat")'

      - run: Rscript tools/publish.R artifacts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src bin
          git diff --cached --quiet && { echo "Nothing to publish."; exit 0; }
          git commit -m "BGS ${{ needs.version.outputs.version }} (geol-skills/BGS@${{ needs.version.outputs.sha }})"
          git pull --rebase
          git push

  # Install from the live site, exactly as students will
  smoke:
    needs: [version, publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: r-lib/actions/setup-r@v2

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          for i in $(seq 60); do
            curl -fsS "$REPO_URL/src/contrib/PACKAGES" | grep -q \
              "^Version: ${{ needs.version.outputs.version }}$" && exit 0
            sleep 10
          done
          echo "::error::$REPO_URL does not list BGS ${{ needs.version.outputs.version }}"
          exit 1

      - name: Install as a student would
        shell: Rscript {0}
        run: |
          options(warn = 2)
          lib <- tempfile("lib")
          dir.create(lib)
          install.packages(
            "BGS", lib = lib,
            repos = c(Sys.getenv("REPO_URL"), getOption("repos"))
          )
          library("BGS", lib.loc = lib)
          stopifnot(
            packageVersion("BGS", lib.loc = lib) ==
              "${{ needs.version.outputs.version }}",
            Bedrock(54.7733, -1.5762)$lex == "PSMCM"
          )

  smoke-webr:
    needs: [version, publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-save "$WEBR_NPM" ws

      - run: node tools/smoke-webr.mjs "$REPO_URL"
